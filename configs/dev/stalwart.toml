# Stalwart v0.11.8 test configuration, local only. Never expose to the Internet.
# Based on Stalwart minimal config + JMAP HTTP listener.
# See: https://stalw.art/docs/configuration/overview and https://stalw.art/docs/http/jmap/overview/

[server]
hostname = "local.nerve.email"

[server.listener."smtp"]
bind = ["[::]:25"]
protocol = "smtp"
tls.enable = false

[server.listener."submission"]
bind = ["[::]:587"]
protocol = "smtp"

[server.listener."imaps"]
bind = ["[::]:993"]
protocol = "imap"
tls.implicit = true

[server.listener."jmap"]
bind = ["[::]:8080"]
protocol = "http"
tls.implicit = false

[server.http]
url = "'http://stalwart:8080'"

[storage]
data = "rocksdb"
fts = "rocksdb"
blob = "rocksdb"
lookup = "rocksdb"
directory = "memory"

[store."rocksdb"]
type = "rocksdb"
path = "/opt/stalwart/data"
compression = "lz4"

[directory."memory"]
type = "memory"

[[directory."memory".principals]]
name = "admin"
class = "admin"
description = "Admin"
secret = "%{env:STALWART_PASSWORD}%"
email = ["admin@local.nerve.email"]

[[directory."memory".principals]]
name = "dev"
class = "individual"
description = "Dev User"
secret = "%{env:STALWART_PASSWORD}%"
email = ["dev@local.nerve.email"]

[tracer."stdout"]
type = "stdout"
level = "info"
ansi = false
enable = true

[authentication.fallback-admin]
user = "admin"
secret = "%{env:STALWART_PASSWORD}%"

# Synthetic local messages must reach Inbox; this is not a public mail server.
[spam-filter]
enable = false
