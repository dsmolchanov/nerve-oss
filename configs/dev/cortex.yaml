http:
  addr: "0.0.0.0:8088"
  read_timeout: 30s

memory:
  budget_bytes: 67108864

dev:
  mode: true

jmap:
  url: "http://stalwart:8080/jmap"
  session_url: "http://stalwart:8080/.well-known/jmap"
  account_id: ""
  username: ""
  password: ""
  push_secret: ""
  poll_interval: 30s

smtp:
  host: "mailpit"
  port: 1025
  username: ""
  password: ""
  from: "dev@local.nerve.email"

database:
  dsn: "postgres://neuralmail@postgres:5432/neuralmail?sslmode=disable"

qdrant:
  url: "http://qdrant:6333"
  collection: "messages_v1536"
  embed_dim: 1536

redis:
  url: "redis://redis:6379/0"

embedding:
  provider: "noop"
  model: "text-embedding-3-small"
  dim: 1536

llm:
  provider: "noop"
  model: "gpt-4o-mini"
  prompt_path: "configs/prompts/v1"

policy:
  default_path: "configs/policy/support-default-v1.yaml"

mcp:
  protocol_version: "2025-11-25"
  allow_origins:
    - "http://localhost:8088"

security:
  allow_outbound: false
  allow_send_with_warnings: false
  outbound_domain_allowlist:
    - "local.nerve.email"

log:
  level: "info"
