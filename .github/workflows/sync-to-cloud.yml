name: Sync OSS → Cloud

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neuralmail
          POSTGRES_PASSWORD: neuralmail
          POSTGRES_DB: neuralmail
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U neuralmail"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout nerve-oss
        uses: actions/checkout@v4
        with:
          path: oss
          fetch-depth: 0

      - name: Checkout nerve-cloud
        uses: actions/checkout@v4
        with:
          repository: dsmolchanov/nerve-cloud
          token: ${{ secrets.CLOUD_SYNC_PAT }}
          path: cloud

      - name: Apply manifest-owned changes
        id: changes
        env:
          HEAD_REF: ${{ github.sha }}
        run: |
          # A prior push may have failed before publishing its Cloud PR.
          # Compare against adopted authority, not only the immediately prior push.
          base_ref="$(oss/scripts/sync/resolve_cloud_base.sh "$PWD/oss" "$PWD/cloud" "$HEAD_REF")"
          oss/scripts/sync/apply_to_cloud.sh \
            "$PWD/oss" "$PWD/cloud" "$base_ref" "$HEAD_REF" \
            /tmp/changed_files.txt
          if [ ! -s /tmp/changed_files.txt ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify exact mirror
        if: steps.changes.outputs.has_changes == 'true'
        run: oss/scripts/sync/verify_exact_mirror.sh oss/sync-manifest.yaml oss cloud

      - name: Advance OSS source authority
        if: steps.changes.outputs.has_changes == 'true'
        env:
          OSS_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          lock_file="cloud/deploy/cloud/oss-source.lock"
          test "$(grep -c '^OSS_SOURCE_REVISION=' "$lock_file")" -eq 1
          test "$(grep -c '^OSS_SYNC_MANIFEST_SHA256=' "$lock_file")" -eq 1
          manifest_sha="$(sha256sum oss/sync-manifest.yaml | awk '{print $1}')"
          sed -i "s/^OSS_SOURCE_REVISION=.*/OSS_SOURCE_REVISION=${OSS_SOURCE_REVISION}/" "$lock_file"
          sed -i "s/^OSS_SYNC_MANIFEST_SHA256=.*/OSS_SYNC_MANIFEST_SHA256=${manifest_sha}/" "$lock_file"

      - uses: actions/setup-go@v5
        if: steps.changes.outputs.has_changes == 'true'
        with:
          go-version: "1.25.13"

      - name: Qualify Cloud credential utility collector
        if: steps.changes.outputs.has_changes == 'true'
        timeout-minutes: 3
        env:
          COLLECTOR_CONTAINER_ID: ${{ job.services.postgres.id }}
          COLLECTOR_INITIAL_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          set -euo pipefail
          [[ "$COLLECTOR_CONTAINER_ID" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$COLLECTOR_INITIAL_PORT" =~ ^[0-9]+$ ]] || exit 1
          (( COLLECTOR_INITIAL_PORT >= 1 && COLLECTOR_INITIAL_PORT <= 65535 )) || exit 1
          export PGCONNECT_TIMEOUT=3
          initial_dsn="postgres://neuralmail:neuralmail@127.0.0.1:${COLLECTOR_INITIAL_PORT}/neuralmail?sslmode=disable"
          initial_ready=false
          for attempt in {1..30}; do
            if [[ "$(psql "$initial_dsn" -XAt -v ON_ERROR_STOP=1 -c 'SELECT 1' 2>/dev/null)" == 1 ]]; then initial_ready=true; break; fi
            sleep 1
          done
          [[ "$initial_ready" == true ]] || exit 1
          psql "$initial_dsn" -Xq -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_preload_libraries='pg_stat_statements'"
          docker restart --time 5 "$COLLECTOR_CONTAINER_ID" >/dev/null
          actual_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort}}' "$COLLECTOR_CONTAINER_ID")"
          [[ "$actual_port" =~ ^[0-9]+$ ]] || exit 1
          (( actual_port >= 1 && actual_port <= 65535 )) || exit 1
          actual_dsn="postgres://neuralmail:neuralmail@127.0.0.1:${actual_port}/neuralmail?sslmode=disable"
          for attempt in {1..30}; do
            if [[ "$(psql "$actual_dsn" -XAt -v ON_ERROR_STOP=1 -c "SELECT current_setting('shared_preload_libraries')='pg_stat_statements' AND current_setting('pg_stat_statements.track') IN('top','all') AND current_setting('pg_stat_statements.track_utility')='on'" 2>/dev/null)" == t ]]; then
              echo "NM_TEST_DB_DSN=$actual_dsn" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "::error::required Cloud credential utility collector unavailable"
          exit 1

      - name: Build and test cloud
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: cloud
        env:
          NM_REQUIRE_DB: "1"
          TZ: UTC
        run: |
          go build ./...
          go test ./... -count=1 -timeout=30m

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          path: cloud
          token: ${{ secrets.CLOUD_SYNC_PAT }}
          branch: sync/oss-${{ github.sha }}
          delete-branch: true
          title: "sync: port nerve-oss changes"
          body: |
            Automated sync from [nerve-oss@`${{ github.sha }}`](https://github.com/dsmolchanov/nerve-oss/commit/${{ github.sha }}).

            **Commit message:** ${{ github.event.head_commit.message }}

            **Changed shared files:**
            ```
            ${{ steps.changes.outputs.has_changes == 'true' && '(see below)' || 'none' }}
            ```

            Exact-mirror paths were copied from OSS and byte-compared. Patch-synced
            paths were applied with `git apply --3way`; conflicts fail the workflow
            before a PR is opened. Cloud-only paths were excluded.
          labels: sync,automated
